apiVersion: v1
kind: ConfigMap
metadata: {name: app-config, namespace: cloudshop}
data:
  DB_HOST: postgres
  DB_NAME: cloudshop
  DB_USER: cloudshop
  REDIS_HOST: redis
  APP_MESSAGE: CloudShop
  EXTERNAL_URL: http://external-mock:8080
---
apiVersion: v1
kind: Service
metadata: {name: postgres, namespace: cloudshop}
spec:
  clusterIP: None
  selector: {app: postgres}
  ports: [{port: 5432, targetPort: 5432}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: postgres, namespace: cloudshop}
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: {app: postgres}
  template:
    metadata:
      labels: {app: postgres}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      containers:
        - name: postgres
          image: postgres:16.8-alpine
          env:
            - {name: POSTGRES_DB, value: cloudshop}
            - {name: POSTGRES_USER, value: cloudshop}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: db-credentials, key: DB_PASSWORD}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
          ports: [{containerPort: 5432}]
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: '1', memory: 512Mi}
          readinessProbe:
            exec:
              command: [sh, -c, 'pg_isready -U cloudshop -d cloudshop']
            initialDelaySeconds: 5
          volumeMounts:
            - {name: pgdata, mountPath: /var/lib/postgresql/data}
  volumeClaimTemplates:
    - metadata: {name: pgdata}
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: {storage: 1Gi}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: redis, namespace: cloudshop}
spec:
  replicas: 1
  selector:
    matchLabels: {app: redis}
  template:
    metadata:
      labels: {app: redis}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: redis
          image: redis:7.4.2-alpine
          args: [redis-server, --save, '', --appendonly, 'no']
          ports: [{containerPort: 6379}]
          resources:
            requests: {cpu: 50m, memory: 32Mi}
            limits: {cpu: 300m, memory: 128Mi}
          readinessProbe:
            exec: {command: [redis-cli, ping]}
---
apiVersion: v1
kind: Service
metadata: {name: redis, namespace: cloudshop}
spec:
  selector: {app: redis}
  ports: [{port: 6379, targetPort: 6379}]
