# Requires Gateway API CRDs and an implementation providing book-gateway GatewayClass.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata: {name: cloudshop, namespace: cloudshop}
spec:
  gatewayClassName: book-gateway
  listeners:
    - {name: http, protocol: HTTP, port: 80}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: cloudshop, namespace: cloudshop}
spec:
  parentRefs: [{name: cloudshop}]
  hostnames: [cloudshop.example.test]
  rules:
    - matches:
        - path: {type: PathPrefix, value: /api}
      backendRefs: [{name: api, port: 8080}]
    - matches:
        - path: {type: PathPrefix, value: /}
      backendRefs: [{name: web, port: 8080}]
