# Requires a controller whose IngressClass is book-ingress. Change to your verified class.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: {name: cloudshop, namespace: cloudshop}
spec:
  ingressClassName: book-ingress
  rules:
    - host: cloudshop.example.test
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service: {name: api, port: {number: 8080}}
          - path: /
            pathType: Prefix
            backend:
              service: {name: web, port: {number: 8080}}
