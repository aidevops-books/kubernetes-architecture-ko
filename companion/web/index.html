<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CloudShop · 아키텍처 실습</title>
<style>body{max-width:760px;margin:60px auto;padding:24px;font-family:system-ui,sans-serif;background:#f6f8fa;color:#152840}h1{font-size:42px}article{background:white;padding:24px;margin:16px 0;border:1px solid #cbd5e1;border-radius:12px}button{padding:12px 20px;background:#155e75;color:white;border:0;border-radius:6px;cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere}small{color:#475569}</style>
<small>『아키텍처를 읽는 법』 03 · 교육용 합성 데이터</small><h1>CloudShop</h1>
<p>상품을 조회하고 주문을 접수하며 요청의 흐름을 확인합니다.</p><div id="products"></div><pre id="result" aria-live="polite"></pre>
<script>
const result=document.querySelector('#result');
async function start(){try{const r=await fetch('/api/products');if(!r.ok)throw Error('조회 HTTP '+r.status);const data=await r.json();for(const p of data.products){const a=document.createElement('article'),h=document.createElement('h2'),v=document.createElement('p'),b=document.createElement('button');h.textContent=p.name;v.textContent=p.price.toLocaleString()+'원';b.textContent='학습용 주문';let key=null;b.onclick=async()=>{b.disabled=true;key=key||crypto.randomUUID();try{const response=await fetch('/api/orders',{method:'POST',headers:{'Content-Type':'application/json','Idempotency-Key':key},body:JSON.stringify({product_id:p.id,quantity:1})});const body=await response.json();result.textContent=JSON.stringify(body,null,2);if(response.ok)key=null;}catch(e){result.textContent='응답 확인 실패. 다시 누르면 같은 키로 재시도합니다. '+e.message;}finally{b.disabled=false;}};a.append(h,v,b);document.querySelector('#products').append(a);}result.textContent='상품 데이터 출처: '+data.source;}catch(e){result.textContent='API 연결 확인 필요: '+e.message;}}start();
</script></html>
