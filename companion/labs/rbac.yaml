apiVersion: v1
kind: ServiceAccount
metadata: {name: observer, namespace: cloudshop}
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: pod-observer, namespace: cloudshop}
rules:
  - apiGroups: ['']
    resources: [pods]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: pod-observer, namespace: cloudshop}
subjects:
  - {kind: ServiceAccount, name: observer, namespace: cloudshop}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: pod-observer}
