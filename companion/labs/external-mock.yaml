apiVersion: v1
kind: ConfigMap
metadata: {name: external-mock-code, namespace: cloudshop}
data:
  server.py: |
    import json, os, time
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
    class Handler(BaseHTTPRequestHandler):
        def do_GET(self):
            time.sleep(float(os.environ.get('DELAY_SECONDS', '0')))
            fail = os.environ.get('FAIL', 'false') == 'true'
            data = json.dumps({'text': 'Mock description', 'shipping': 'available'}).encode()
            self.send_response(503 if fail else 200)
            self.send_header('Content-Type', 'application/json')
            self.send_header('Content-Length', str(len(data)))
            self.end_headers()
            try:
                self.wfile.write(data)
            except (BrokenPipeError, ConnectionResetError):
                pass
    ThreadingHTTPServer(('0.0.0.0', 8080), Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: external-mock, namespace: cloudshop}
spec:
  replicas: 1
  selector:
    matchLabels: {app: external-mock}
  template:
    metadata:
      labels: {app: external-mock}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: mock
          image: python:3.12.10-slim
          command: [python, /app/server.py]
          env:
            - {name: DELAY_SECONDS, value: '0'}
            - {name: FAIL, value: 'false'}
          ports: [{containerPort: 8080}]
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {cpu: 200m, memory: 128Mi}
          volumeMounts:
            - {name: code, mountPath: /app, readOnly: true}
      volumes:
        - name: code
          configMap: {name: external-mock-code}
---
apiVersion: v1
kind: Service
metadata: {name: external-mock, namespace: cloudshop}
spec:
  selector: {app: external-mock}
  ports: [{port: 8080, targetPort: 8080}]
